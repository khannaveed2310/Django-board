<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create New Board</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  </head>
  <body class="bg-gray-50">
    <div class="max-w-lg mx-auto mt-10 p-6 bg-white rounded shadow">
      <h2 class="text-xl font-bold mb-4">Create New Board</h2>
      <form method="post">
        {% csrf_token %}
        <div class="mb-4">
          <label class="block mb-1 font-medium">Board Name</label>
          <input type="text" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded" />
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium">Description</label>
          <textarea name="description" required class="w-full px-3 py-2 border border-gray-300 rounded"></textarea>
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
          Create Board
        </button>
      </form>
    </div>
  </body>
</html>
