<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Django Boards</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen">
    <!-- ✅ Move navbar include here -->
    {% include 'navbar.html' %}

    <!-- Login Form Container -->
    <div class="flex items-center justify-center py-12">
      <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
          Login to Django Boards
        </h2>

        {% if form.errors %}
          <div class="mb-4 text-sm text-red-600">
            Please correct the error{{ form.errors }} below.
          </div>
        {% endif %}

        <form method="post" class="space-y-5">
          {% csrf_token %}

          <!-- Username Field -->
          <div>
            <label for="username" class="block mb-1 text-gray-700 font-medium"
              >Username</label
            >
            <input
              type="text"
              name="username"
              id="username"
              required
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter your username"
            />
          </div>

          <!-- Password Field -->
          <div>
            <label for="password" class="block mb-1 text-gray-700 font-medium"
              >Password</label
            >
            <input
              type="password"
              name="password"
              id="password"
              required
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter your password"
            />
          </div>

          <!-- Submit Button -->
          <div>
            <button
              type="submit"
              class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition"
            >
              Login
            </button>
          </div>
        </form>

        <p class="text-sm text-center text-gray-600 mt-6">
          Don't have an account?
          <a href="{% url 'signup' %}" class="text-blue-600 hover:underline">
            Sign up here
          </a>
        </p>
      </div>
    </div>
  </body>
</html>
